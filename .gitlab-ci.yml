include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml


.yarn-cache:
  before_script:
    - yarn install --immutable
  cache:
    paths:
      - node_modules
      - .yarn
    key:
      files:
        - yarn.lock


stages:
  - test
  - release

